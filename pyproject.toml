[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "deerflow-eval-platform"
version = "0.1.0"
description = "Scenario-oriented evaluation foundation for DeerFlow support agents"
requires-python = ">=3.11"
dependencies = []
[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8,<1"]
[project.scripts]
deer-eval = "eval_platform.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
